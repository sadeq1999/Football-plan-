<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشكيلة الفريق</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الملعب -->
  <div class="pitch">
    
    <!-- كارت لاعب (تقييم أعلى من 90 - مع نار) -->
    <div class="player-card fire-effect" style="top: 15%; left: 40%;">
      <div class="fire-animation"></div>
      <img class="player-img" src="player1.png" alt="علي عبد">
      <div class="badge-container">
        <div class="rating">90</div>
        <div class="position cmf">CMF</div>
      </div>
      <div class="player-name">علي عبد</div>
    </div>

    <!-- كارت لاعب عالي (تقييم عادي) -->
    <div class="player-card" style="top: 45%; left: 60%;">
      <img class="player-img" src="player2.png" alt="احمد ناصر">
      <div class="badge-container">
        <div class="rating">82</div>
        <div class="position cmf">CMF</div>
      </div>
      <div class="player-name">احمد ناصر</div>
    </div>

    <!-- كارت حارس -->
    <div class="player-card" style="top: 75%; left: 40%;">
      <img class="player-img" src="player3.png" alt="جعفر">
      <div class="badge-container">
        <div class="rating">86</div>
        <div class="position gk">GK</div>
      </div>
      <div class="player-name">جعفر</div>
    </div>

  </div>

</body>
</html>
